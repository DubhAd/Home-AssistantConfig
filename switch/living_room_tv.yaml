- platform: template
  switches:
    living_room_tv:
      value_template: >-
        {{ is_state('media_player.lounge_tcl_roku_tv','on') }}
      availability_template: >-
        {{ not is_state('media_player.lounge_tcl_roku_tv','unavailable') }}
      turn_on:
        service: media_player.turn_on
        target:
          entity_id: media_player.lounge_tcl_roku_tv
      turn_off:
        service: media_player.turn_off
        target:
          entity_id: media_player.lounge_tcl_roku_tv
      icon_template: >-
        {% if is_state('media_player.lounge_tcl_roku_tv','on') %}
          mdi:television
        {% else %}
          mdi:television-off
        {% endif %}
