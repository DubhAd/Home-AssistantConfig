title: Overview
type: masonry
id: home
path: home
icon: mdi:home
cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-chips-card
      chips:
        - type: entity
          entity: input_text.person_person3
          use_entity_picture: true
          double_tap_action:
            action: none
          tap_action:
            action: none
          hold_action:
            action: none
        - type: entity
          entity: input_text.person_person1
          use_entity_picture: true
          double_tap_action:
            action: none
          tap_action:
            action: none
          hold_action:
            action: none
        - type: entity
          entity: input_text.person_person2
          use_entity_picture: true
          double_tap_action:
            action: none
          tap_action:
            action: none
          hold_action:
            action: none
        - type: entity
          entity: input_text.car_location
          use_entity_picture: true
          double_tap_action:
            action: none
          tap_action:
            action: none
          hold_action:
            action: none
        - type: entity
          entity: input_text.person_person4
          use_entity_picture: true
          double_tap_action:
            action: none
          tap_action:
            action: none
          hold_action:
            action: none
        - type: weather
          entity: weather.tomorrow_io_home_nowcast
          show_conditions: true
          show_temperature: true
          tap_action:
            action: none
          double_tap_action:
            action: none
          hold_action:
            action: none
        - type: alarm-control-panel
          entity: alarm_control_panel.house
        - type: alarm-control-panel
          entity: alarm_control_panel.garage
        - type: conditional
          conditions:
            - entity: sensor.next_bin_collection
              state: tomorrow
          chip:
            type: template
            content: >-
              {{ state_attr('sensor.next_bin_collection','bin_type')|title }} bin tomorrow
            icon: mdi:delete
            icon_color: orange
            double_tap_action:
              action: none
            tap_action:
              action: none
            hold_action:
              action: none
        - type: conditional
          conditions:
            - entity: sensor.next_bin_collection
              state: today
            - entity: binary_sensor.morning
              state: 'on'
          chip:
            type: template
            content: >-
              {{ state_attr('sensor.next_bin_collection','bin_type')|title }} bin today
            icon: mdi:delete-circle
            icon_color: red
            double_tap_action:
              action: none
            tap_action:
              action: none
            hold_action:
              action: none
      alignment: center
    - type: horizontal-stack
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.tomorrow_io_home_feels_like
          icon_type: entity-picture
          icon: mdi:thermometer-auto
          name: Outside
        - type: custom:mushroom-entity-card
          entity: sensor.downstairs_temp
          icon_type: entity-picture
          name: Downstairs
          icon: mdi:thermometer-chevron-down
        - type: custom:mushroom-entity-card
          entity: sensor.upstairs_temp
          icon_type: entity-picture
          icon: mdi:thermometer-chevron-up
          name: Upstairs
    - type: custom:hourly-weather
      name: ~
      #entity: weather.home_hourly
      #entity: weather.openweathermap
      entity: weather.tomorrow_io_home_hourly
      num_segments: 24
      icons: true
      show_wind: 'direction'
      tap_action:
        action: call-service
        service: input_boolean.toggle
        service_data:
          entity_id: input_boolean.show_weather
      colors:
        fog: '#777'
        cloudy: '#b3bbcf'
        sunny: '#eFeF90'
        windy: '#90cbff'
        windy-variant: '#90cbff'
        lightning: '#5693C8'
        pouring: '#375E80'
    - type: conditional
      conditions:
        - entity: input_boolean.show_weather
          state: 'on'
      card:
        type: vertical-stack
        cards: 
        - type: custom:weather-card
          entity: weather.tomorrow_io_home_daily
          name: Home
          number_of_forecasts: 8
          current: True
          details: True
        - type: custom:weather-card
          entity: weather.tomorrow_io_home_nowcast
          name: Now
          hourly_forecast: true
          number_of_forecasts: 8
          current: false
          details: false
  

  - type: vertical-stack
    cards:

    - type: custom:frigate-card
      cameras:
        - camera_entity: camera.front
          camera_name: front
          frigate_url: http://custodes.family:5000/
          live_provider: go2rtc
          title: Front
      live:
        zoomable: true
        controls:
          next_previous:
            size: 24
      menu:
        style: outside
        position: bottom

