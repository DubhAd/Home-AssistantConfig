title: Weather
type: masonry
id: weather
path: weather
icon: mdi:weather-partly-snowy-rainy
cards:
  - type: vertical-stack
    cards:
    - type: custom:simple-weather-card
      entity: weather.tomorrow_io_home_nowcast
      name: TomorowIO
      backdrop: 
        fade: true
      primary_info:
        - extrema
        - precipitation
        - precipitation_probability
      secondary_info:
        - wind_speed
        - wind_bearing
    - type: custom:weather-card
      entity: weather.tomorrow_io_home_daily
      name: TomorowIO
      number_of_forecasts: 6
      current: true
      details: true
    - type: custom:weather-card
      entity: weather.tomorrow_io_home_hourly
      name: Hourly
      hourly_forecast: true
      number_of_forecasts: 8
      current: false
      details: false
    - type: custom:weather-card
      entity: weather.tomorrow_io_home_nowcast
      name: Now
      hourly_forecast: true
      number_of_forecasts: 8
      current: false
      details: false
  - type: vertical-stack
    cards:
    - type: custom:simple-weather-card
      entity: weather.home
      name: by MetNo
      number_of_forecasts: 6
      backdrop: 
        fade: true
      primary_info:
        - extrema
        - precipitation
        - precipitation_probability
      secondary_info:
        - wind_speed
        - wind_bearing
    - type: custom:weather-card
      entity: weather.home
      name: MetNo
      current: true
      details: true
    - type: custom:weather-card
      entity: weather.met_no_next_6_hours_forecast_home
      name: Next 6
      hourly_forecast: true
      number_of_forecasts: 8
      current: false
      details: false
  - type: vertical-stack
    cards:
    - type: custom:simple-weather-card
      entity: weather.home_meteo
      name: Meteo
      backdrop: 
        fade: true
      secondary_info:
        - wind_speed
        - wind_bearing
    - type: custom:weather-card
      number_of_forecasts: 6
      entity: weather.home_meteo
      name: Meteo
      current: true
      details: true
