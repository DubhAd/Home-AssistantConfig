id: 'office_humidifier_control'
alias: 'Office humidifier control'
initial_state: 'on'
triggers:
  - trigger: state
    entity_id: input_boolean.office_occupied
    to: 'on'
    id: 'occupied'
  - trigger: state
    entity_id: input_boolean.office_occupied
    to: 'off'
    id: 'unoccupied'
  - trigger: state
    entity_id: input_boolean.office_paused
    to: 'on'
    id: 'paused'
  - trigger: state
    entity_id: input_boolean.office_paused
    to: 'off'
    id: 'unpaused'
actions:
  - choose:
        # Room occupied, turn it on
      - conditions:
          - condition: trigger
            id: 'occupied'
          - condition: state
            entity_id: humidifier.dual_200s
            state: 'off'
        sequence:
          - action: humidifier.turn_on
            target:
              entity_id: humidifier.dual_200s
        # Room empty, turn it off
      - conditions:
          - condition: trigger
            id: 'unoccupied'
          - condition: state
            entity_id: group.work_laptop
            state: 'not_home'
        sequence:
          - action: humidifier.turn_off
            target:
              entity_id: humidifier.dual_200s
        # Set it to low
      - conditions:
          - condition: trigger
            id: 'paused'
          - condition: state
            entity_id: humidifier.dual_200s
            state: 'on'
        sequence:
          - action: number.set_value
            target:
              entity_id: number.dual_200s_mist_level
            data:
              value: 1
        # Set it back to auto
      - conditions:
          - condition: trigger
            id: 'unpaused'
          - condition: state
            entity_id: humidifier.dual_200s
            state: 'on'
        sequence:
          - action: humidifier.set_mode
            data:
              mode: auto
            target:
              entity_id: humidifier.dual_200s
