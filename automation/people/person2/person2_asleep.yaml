id: 'person2_asleep'
alias: 'person2 asleep'
initial_state: 'on'
trigger:
  - platform: state
    entity_id: input_boolean.person2_in_bed
    to: 'on'
    for: '00:10:00'
  - platform: state
    entity_id: event.sleep_as_android_sleep_phase
    attribute: 'event_type'
    to:
      - 'not_awake'
  - platform: state
    entity_id: event.sleep_as_android_sleep_tracking
    attribute: 'event_type'
    to:
      - 'resumed'
condition:
  - condition: state
    entity_id: 
      - input_boolean.person2_is_awake
      - input_boolean.person2_home
    state: 'on'
action:
  - service: input_boolean.turn_on
    entity_id: input_boolean.person2_in_bed
  - service: input_boolean.turn_off
    entity_id: input_boolean.person2_is_awake
  - service: script.turn_on
    entity_id: script.person2_travel_sensor
