id: 'person2_in_bed'
alias: 'person2 in bed'
initial_state: 'on'
trigger:
  - platform: state
    entity_id: event.sleep_as_android_sleep_tracking
    attribute: 'event_type'
    to: 'started'
  - platform: state
    entity_id: input_boolean.master_bedroom_occupied
    to: 'on'
  - platform: time
    at: '22:00:01'
condition:
  # I'm home
  - condition: state
    entity_id: input_boolean.person2_home
    state: 'on'
  # Bedroom occupied
  - condition: state
    entity_id: input_boolean.master_bedroom_occupied
    state: 'on'
  # In the time window for bed
  - condition: time
    after: '22:00:00'
    before: '04:00:00'
  # Sleep tracking has started
  - condition: state
    entity_id: event.sleep_as_android_sleep_tracking
    attribute: 'event_type'
    state: 'started'
action:
  - service: input_boolean.turn_on
    entity_id: input_boolean.person2_in_bed
  - condition: state
    entity_id: input_boolean.person2_driving
    state: 'on'
  - service: input_boolean.turn_off
    entity_id: input_boolean.person2_driving
