- switch:
  - turn_on:
    - target:
        entity_id:
        - media_player.lounge_tcl_roku_tv
      action: media_player.turn_on
    turn_off:
    - target:
        entity_id:
        - media_player.lounge_tcl_roku_tv
      action: media_player.turn_off
    default_entity_id: switch.living_room_tv
    icon: "{% if is_state('media_player.lounge_tcl_roku_tv','on') %}\n  mdi:television\n{%
      else %}\n  mdi:television-off\n{% endif %}"
    availability: '{{ not is_state(''media_player.lounge_tcl_roku_tv'',''unavailable'')
      }}'
    state: '{{ is_state(''media_player.lounge_tcl_roku_tv'',''on'') }}'
    name: living_room_tv
